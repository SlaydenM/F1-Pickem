<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User settings for Notification service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .images {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .images img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>User settings for Notification service</h1>
  <div class="images">
    <div>
      <h3>Before Opt-In</h3>
      <img src="./sms-off.png" alt="Sms Off">
    </div>
    <div>
      <h3>After Opt-In</h3>
      <img src="./sms-on.png" alt="Sms On">
    </div>
  </div>
</body>
</html>
